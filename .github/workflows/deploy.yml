name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Builds with base /portafolio/, then nests output under docs/portafolio/
      # and places app-ads.txt (+ root redirect) at the artifact root.
      - name: Build site
        run: npm run build

      - name: Verify root app-ads.txt
        run: |
          test -f docs/app-ads.txt
          test -f docs/portafolio/index.html
          test ! -f docs/portafolio/app-ads.txt
          echo "Root app-ads.txt:"
          cat docs/app-ads.txt

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
